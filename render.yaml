# render.yaml — Blueprint de Timetracker (rama feature/agregar-jornada)
# Ubicación: RAÍZ del repositorio (junto a REQUIREMENTS.md y CHANGELOG.md).
# Crea de una sola vez: base de datos + backend Spring Boot + frontend estático.
# Solo se despliega el backend de Spring Boot; el de Node no se incluye.

databases:
  - name: timetracker-db
    databaseName: timetracker
    user: timetracker
    plan: free
    region: virginia # Debe ser la misma región del backend (red interna)

services:
  # ------------------------------------------------------------------
  # Backend Spring Boot (Java 21) — se construye con su propio Dockerfile
  # ------------------------------------------------------------------
  - type: web
    name: timetracker-backend
    runtime: docker
    branch: feature/agregar-jornada
    region: virginia
    plan: free
    dockerfilePath: ./proyecto/timetracker-backend-springboot/Dockerfile
    dockerContext: ./proyecto/timetracker-backend-springboot
    healthCheckPath: /health
    envVars:
      # application.yml fija server.port=3000: se le dice a Render que use ese puerto
      - key: PORT
        value: "3000"
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: TZ
        value: America/Bogota
      # postgres://user:pass@host:port/db -> DatabaseUrlConverter lo convierte a JDBC
      - key: DATABASE_URL
        fromDatabase:
          name: timetracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto aleatorio largo (>= 32 chars)
      - key: JWT_EXPIRES_IN
        value: 1h
      # Origen permitido por CORS: la URL pública del frontend
      - key: CORS_ORIGIN
        value: https://timetracker-frontend.onrender.com
      - key: LOG_LEVEL
        value: INFO
      # Seed del admin: dejar "true" en el primer deploy y luego cambiar a "false"
      - key: RUN_SEED_ON_START
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin@empresa.com
      - key: SEED_ADMIN_NOMBRE
        value: Administrador Inicial
      - key: SEED_ADMIN_PASSWORD
        sync: false # Render te lo pide al aplicar el Blueprint (no queda en el repo)
      # El plan free tiene 512 MB de RAM: se limita el heap de la JVM
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx300m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"

  # ------------------------------------------------------------------
  # Frontend React + Vite — sitio estático (sin Docker ni nginx)
  # ------------------------------------------------------------------
  - type: web
    name: timetracker-frontend
    runtime: static
    branch: feature/agregar-jornada
    rootDir: proyecto/timetracker-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA: cualquier ruta cae en index.html (equivale al try_files del nginx.conf)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Se "hornea" en el bundle durante el build (Vite): debe ser la URL pública del backend
      - key: VITE_API_BASE_URL
        value: https://timetracker-backend.onrender.com/api/v1
