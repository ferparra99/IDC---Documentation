server:
  port: 3000

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/timetracker}
    username: ${POSTGRES_USER:timetracker}
    password: ${POSTGRES_PASSWORD:timetracker}
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        stringtype: unspecified
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 9

app:
  jwt:
    secret: ${JWT_SECRET:cambia-este-valor-por-un-secreto-largo-y-aleatorio-min-32chars}
    expires-in: ${JWT_EXPIRES_IN:1h}
    refresh-expires-in: 30d
  cors:
    allowed-origins: ${CORS_ORIGIN:*}
  zona-horaria: America/Bogota
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@empresa.com}
    admin-password: ${SEED_ADMIN_PASSWORD:CambiarEnProduccion123}
    admin-nombre: ${SEED_ADMIN_NOMBRE:Administrador Inicial}
    run-on-start: ${RUN_SEED_ON_START:false}

logging:
  level:
    com.idc.timetracker: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# Para convertir DATABASE_URL estilo postgres:// a jdbc: se soporta ambas via env
# Flyway usa la misma datasource
