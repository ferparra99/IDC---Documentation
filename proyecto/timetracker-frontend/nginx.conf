server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html,
    # para que el enrutado propio de React no dependa de rutas reales en disco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachear agresivamente los assets versionados que genera Vite (tienen
    # hash en el nombre de archivo, así que es seguro cachearlos "para siempre").
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
